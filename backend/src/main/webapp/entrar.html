<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CANNAMED - Entrar</title>
    <link rel="stylesheet" href="style-entrar.css">
</head>
<body>

<div class="main-container">
    <div class="card-entrar">
        <h1 class="title">Entrar no Cannamed</h1>
        <p class="subtitle">Insira o seu e-mail e senha para aceder</p>


        <form action="index.html" method="POST" id="form-login" class="form-grid">
            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="form-group">
                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha" required>
            </div>

            <div class="form-submit">
                <button type="submit" class="btn-submit">Entrar</button>
            </div>
        </form>

        <div class="login-footer">
            Ainda não tem conta? <a href="cadastro.html">Criar conta</a>
        </div>
    </div>
</div>


<script>
    document.getElementById('form-login').addEventListener('submit', function(event) {
        const email = document.getElementById('email').value.trim();
        const senha = document.getElementById('senha').value.trim();

        if (!email || !senha) {
            alert('Por favor, preencha todos os campos antes de continuar.');
            event.preventDefault(); // Impede o envio se estiver vazio
        }
    });
</script>

</body>
</html>
