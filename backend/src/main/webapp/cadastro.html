<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CANNAMED - Criar Conta do Paciente</title>
    <link rel="stylesheet" href="style-cadastro.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

<header class="navbar">
    <div class="logo">CANNAMED</div>
    <nav class="nav-links">
        <a href="index.html">Início</a>
        <a href="minhas-consultas.html">Consultas</a>
        <a href="#">Sobre</a>
        <a href="#">Profissionais</a>
    </nav>
    <div class="auth-buttons">
        <a href="entrar.html" class="btn-login">Entrar</a>
        <a href="cadastro.html" class="btn-register-nav">Criar conta</a>
    </div>
</header>

<main class="main-container">
    <div class="card-cadastro">
        <h1 class="title">Criar conta do paciente</h1>
        <p class="subtitle">Preencha seus dados para começar agendar uma consulta</p>


        <form action="index.html" method="POST" class="form-grid">
            <div class="form-group">
                <label for="nome">Nome completo</label>
                <input type="text" id="nome" name="nome" required>
            </div>

            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="form-group">
                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha" required>
            </div>

            <div class="form-group">
                <label for="confirmar-senha">Confirmar Senha</label>
                <input type="password" id="confirmar-senha" name="confirmarSenha" required>
            </div>

            <div class="form-group">
                <label for="cpf">CPF</label>
                <input type="text" id="cpf" name="cpf" required>
            </div>

            <div class="form-group">
                <label for="data-nascimento">Data de nascimento</label>
                <input type="date" id="data-nascimento" name="dataNascimento" required>
            </div>

            <div class="form-submit">
                <button type="submit" class="btn-submit">Criar conta</button>
            </div>
        </form>

        <div class="login-footer">
            Já possui uma conta ? <a href="entrar.html">Entrar</a>
        </div>
    </div>
</main>
<script>
    document.querySelector('.form-grid').addEventListener('submit', function(event) {
        const senha = document.getElementById('senha').value;
        const confirmarSenha = document.getElementById('confirmar-senha').value;

        if (senha !== confirmarSenha) {
            alert('As senhas não coincidem! Por favor, verifique.');
            event.preventDefault(); // Impede o envio do formulário
        }
    });
</script>
</body>



</html>
