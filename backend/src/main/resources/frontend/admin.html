<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CANNAMED - Painel Administrativo</title>
    <link rel="stylesheet" href="style-admin.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>


<header class="navbar">
    <a href="index.html" class="logo">
        CANNAMED
    </a>
    <nav class="nav-links">
        <a href="index.html">Início</a>
        <a href="minhas-consultas.html">Consultas</a>
        <a href="#">Sobre</a>
        <a href="#">Profissionais</a>
    </nav>
    <div class="auth-buttons">
        <a href="entrar.html" class="btn-login">Sair</a>
    </div>
</header>


<main class="admin-container">
    <div class="admin-wrapper">


        <div class="admin-header-title">
            <h1>Painel administrativo</h1>
            <p>Visão geral do sistema</p>
        </div>


        <div class="metrics-grid">
            <div class="metric-card">
                <span class="metric-label">Pacientes:</span>
                <span class="metric-value">0</span>
            </div>

            <div class="metric-card">
                <span class="metric-label">Profissionais:</span>
                <span class="metric-value">4</span>
            </div>

            <div class="metric-card">
                <span class="metric-label">Consultas:</span>
                <span class="metric-value">0</span>
            </div>

            <div class="metric-card">
                <span class="metric-label">Usuarios:</span>
                <span class="metric-value">0</span>
            </div>
        </div>


        <div class="consultas-panel-card">
            <h2>Consultas:</h2>

        </div>

    </div>
</main>

</body>
</html>
