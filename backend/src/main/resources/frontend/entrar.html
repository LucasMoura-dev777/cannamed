<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CANNAMED - Entrar no CANNAMED</title>
    <link rel="stylesheet" href="style-entrar.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

<!-- Header / Navbar -->
<header class="navbar">
    <a href="index.html" class="logo">
        CANNAMED
    </a>
    <nav class="nav-links">
        <a href="index.html">Início</a>
        <a href="#">Consultas</a>
        <a href="#">Sobre</a>
        <a href="#">Profissionais</a>
    </nav>
    <div class="auth-buttons">
        <a href="login.html" class="btn-login">Entrar</a>
        <a href="cadastro.html" class="btn-register-nav">Criar conta</a>
    </div>
</header>

<!-- Área Principal / Form Container -->
<main class="main-container">
    <div class="card-login">
        <h1 class="title">Entrar no CANNAMED</h1>

        <form action="#" method="POST" class="form-login">
            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" placeholder="Seu@email.com" required>
            </div>

            <div class="form-group">
                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha" placeholder="*****" required>
            </div>

            <div class="form-submit">
                <button type="submit" class="btn-submit">Entrar</button>
            </div>
        </form>

        <div class="login-footer">
            Ainda não tem uma conta ? <a href="cadastro.html">Cadastre-se</a>
        </div>
    </div>
</main>

</body>
</html>
