<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CANNAMED - Agendar Consulta</title>
    <link rel="stylesheet" href="style-agendar.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>


<header class="navbar">
    <div class="logo">
        CANNAMED
    </div>
    <nav class="nav-links">
        <a href="index.html">Início</a>
        <a href="#">Consultas</a>
        <a href="#">Sobre</a>
        <a href="#">Profissionais</a>
    </nav>
    <div class="auth-buttons">
        <a href="entrar.html" class="btn-login">Entrar</a>
        <a href="cadastro.html" class="btn-register-nav">Criar conta</a>
    </div>
</header>


<main class="main-container">
    <div class="agendar-layout">


        <div class="card-medico-resumo">
            <div class="medico-header">
                <div class="avatar-circle">TF</div>
                <h3 class="medico-nome">Dr. Thiago Felipe</h3>
            </div>
            <div class="medico-detalhes">
                <p>CRM : 123456</p>
                <p>São Paulo - Interlagos</p>
                <p>Avaliação : 5.0</p>
                <p>Especialidade: Epilepsia</p>
            </div>
            <div class="medico-preco">
                <span>R$ 100,00</span>
            </div>
        </div>


        <div class="card-datas">
            <h3>Escolha a data</h3>
            <div class="datas-grid">
                <button class="btn-opcao active">17/08</button>
                <button class="btn-opcao">18/08</button>
                <button class="btn-opcao">19/08</button>
                <button class="btn-opcao">20/08</button>
                <button class="btn-opcao">21/08</button>
                <button class="btn-opcao">22/08</button>
                <button class="btn-opcao">23/08</button>
                <button class="btn-opcao">24/08</button>
                <button class="btn-opcao">25/08</button>
            </div>
        </div>


        <div class="card-horarios">
            <h3>Escolha o horário</h3>
            <div class="horarios-list">
                <button class="btn-opcao active">10:00</button>
                <button class="btn-opcao">13:00</button>
                <button class="btn-opcao">14:00</button>
            </div>
        </div>

    </div>


    <div class="confirmar-container">
        <a href="minhas-consultas.html" class="btn-confirmar">Confirmar Consulta</a>
    </div>
</main>

</body>
</html>
